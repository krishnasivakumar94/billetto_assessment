default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: billetto_assessment_development







test:
  <<: *default
  database: billetto_assessment_test

production:
  <<: *default
  database: billetto_assessment_production
  username: billetto_assessment
  password: <%= ENV["BILLETTO_ASSESSMENT_DATABASE_PASSWORD"] %>
